<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HTML Segment Aligner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a1f;
      --border: #2a2a32;
      --text: #e8e6e3;
      --muted: #8b8685;
      --accent: #7c9eff;
      --accent-dim: #5a7ad4;
      --success: #6ee7b7;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Outfit", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .toolbar label { font-size: 0.9rem; color: var(--muted); }
    select {
      font-family: inherit;
      padding: 0.4rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
    }
    select:focus { outline: none; border-color: var(--accent); }
    button {
      font-family: inherit;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      transition: opacity 0.15s, background 0.15s;
    }
    button:hover { opacity: 0.9; }
    button.primary {
      background: var(--accent);
      color: #0f0f12;
    }
    button.secondary {
      background: var(--border);
      color: var(--text);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .table-wrap {
      overflow: auto;
      min-height: 60vh;
    }
    .grid-header {
      display: grid;
      gap: 0;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .grid-body {
      display: grid;
      gap: 0;
    }
    .col-header {
      padding: 0.6rem 0.75rem;
      background: var(--surface);
      font-weight: 600;
      font-size: 0.85rem;
    }
    .col-header.idx { min-width: 80px; }
    .cell {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      line-height: 1.4;
      overflow-wrap: break-word;
    }
    .cell.idx {
      color: var(--muted);
      font-size: 0.75rem;
    }
    .cell.translation { background: rgba(124, 158, 255, 0.06); }
    .cell { position: relative; }
    .cell .chrf-score { position: absolute; bottom: 2px; right: 6px; font-size: 0.65rem; color: var(--muted); }
    .cell.chrf-good { background: rgba(110, 231, 183, 0.15) !important; }
    .cell.chrf-bad { background: rgba(248, 113, 113, 0.2) !important; }
    .cell-editable { position: relative; }
    .cell-editable .cell-content {
      min-height: 1.5em;
      outline: none;
      white-space: pre-wrap;
    }
    .cell-editable .cell-content:focus { background: rgba(124, 158, 255, 0.08); }
    .cell-btn-row {
      position: absolute;
      top: 2px;
      right: 2px;
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .cell-editable:hover .cell-btn-row { opacity: 1; }
    .cell-editable .btn-clear {
      padding: 0.15rem 0.4rem;
      font-size: 0.7rem;
      background: var(--border);
      color: var(--muted);
      border-radius: 4px;
      cursor: pointer;
    }
    .cell-editable .btn-clear:hover { background: var(--error); color: #fff; }
    .col-header .btn-add-below { margin-left: 0.4rem; }
    .empty { text-align: center; padding: 3rem; color: var(--muted); }
    .status { font-size: 0.85rem; color: var(--muted); margin-left: auto; }
    .status.loading { color: var(--accent); }
    .status.error { color: var(--error); }
    .status.ok { color: var(--success); }
    .seg-row:hover .cell:not(.idx) { background: rgba(255,255,255,0.02); }
    .lang-controls {
      padding: 0.75rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .lang-controls label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
    .lang-controls ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .lang-controls li {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.5rem;
      background: var(--bg);
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .lang-controls li input[type="checkbox"] { margin: 0; cursor: pointer; }
    .lang-controls .drag-handle { cursor: grab; color: var(--muted); }
    .lang-controls .order-btn { padding: 0.15rem 0.4rem; font-size: 0.75rem; }
    .lang-controls .view-toggle { margin-left: 0.25rem; font-size: 0.75rem; }
    .lang-controls .view-toggle select { padding: 0.2rem 0.4rem; font-size: 0.75rem; }
    .lang-controls .btn-translate { padding: 0.2rem 0.5rem; font-size: 0.7rem; }
    .debug-panel {
      margin: 1rem 1.5rem;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      max-height: 300px;
      overflow: auto;
    }
    .debug-panel summary { cursor: pointer; font-weight: 500; }
    .debug-panel pre { white-space: pre-wrap; word-break: break-all; margin: 0.25rem 0; }
    .alignment-overview {
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .alignment-overview .stats { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .alignment-overview .stat { color: var(--muted); }
    .alignment-overview .stat span { color: var(--accent); font-weight: 600; }
    .cell.excluded { opacity: 0.5; background: rgba(248,113,113,0.1) !important; }
    .cell.will-remove { opacity: 0.6; background: rgba(248,113,113,0.15); text-decoration: line-through; }
    .cell.check-error { outline: 2px solid var(--error); outline-offset: -2px; background: rgba(248,113,113,0.12) !important; }
    .cell.check-error::after {
      content: "⚠";
      position: absolute;
      top: 2px;
      left: 4px;
      color: var(--error);
      font-size: 0.75rem;
    }
    .col-header.check-error-col { outline: 2px solid var(--error); outline-offset: -2px; }
    .row-exclude { padding: 0.2rem; }
    .btn-merge { padding: 0.2rem 0.4rem; font-size: 0.7rem; }
    .btn-add-below { padding: 0.2rem 0.4rem; font-size: 0.7rem; margin-left: 0.2rem; }
  </style>
</head>
<body>
  <div class="toolbar">
    <label>Document</label>
    <select id="docSelect">
      <option value="">-- Select --</option>
    </select>
    <label>Mode</label>
    <select id="modeSelect">
      <option value="browse">Browse (MOS)</option>
      <option value="alignment">Alignment (MOS)</option>
    </select>
    <button class="primary" id="btnTranslate">Translate to first language</button>
    <button class="secondary" id="btnTranslateAll">Translate all documents (cache)</button>
    <button class="secondary" id="btnRefresh">Refresh MOS files</button>
    <button class="secondary" id="btnCheckAlignment">Check alignment</button>
    <button class="secondary" id="btnReexport">Reexport originals (tikal)</button>
    <button class="primary" id="btnApply" style="display:none">Apply to MOS</button>
    <button class="secondary" id="btnUndo" disabled>Undo</button>
    <span class="status" id="status"></span>
  </div>

  <div id="alignmentOverview" class="alignment-overview" style="display:none">
    <div class="stats">
      <span class="stat">Per language: <span id="alignCounts">-</span></span>
      <span class="stat">Common (aligned): <span id="alignCommon">-</span></span>
      <button class="secondary" id="btnHideScheduled" title="Hide cells scheduled for per-lang deletion (only in the language they are deleted in)">Hide scheduled deletions</button>
    </div>
  </div>

  <div id="langControls" class="lang-controls" style="display:none">
    <label>Languages (first = translation target; Translate = translate that language to target; drag to reorder, uncheck to hide)</label>
    <ul id="langList"></ul>
  </div>

  <div id="content">
    <div class="empty">Select a document to view aligned segments.</div>
  </div>

  <script>
    const API = "";
    const CHRF_GOOD = 95;
    const CHRF_BAD = 30;
    function setStatus(msg, cls = "") {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = "status " + cls;
    }
    async function fetchJSON(url) {
      const r = await fetch(API + url);
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    async function loadDocs() {
      setStatus("Loading…", "loading");
      try {
        const docs = await fetchJSON("/api/documents");
        const sel = document.getElementById("docSelect");
        const prev = sel.value;
        sel.innerHTML = '<option value="">-- Select --</option>';
        for (const d of docs) {
          const opt = document.createElement("option");
          opt.value = JSON.stringify({ doc_id: d.doc_id, base_name: d.base_name, languages: d.languages, reexported: !!d.reexported });
          opt.textContent = `${d.doc_id} / ${d.base_name} (${d.languages.join(", ")})${d.reexported ? " [reexported]" : ""}`;
          sel.appendChild(opt);
        }
        if (prev) {
          const hasPrev = Array.from(sel.options).some(o => o.value === prev);
          if (hasPrev) sel.value = prev;
        }
        setStatus("", "");
      } catch (e) {
        setStatus("Error: " + e.message, "error");
      }
    }

    function getVisibleLanguages() {
      const items = document.querySelectorAll("#langList li");
      return Array.from(items).filter(li => li.querySelector("input[type=checkbox]")?.checked).map(li => li.dataset.lang);
    }

    function getLanguageOrder() {
      const items = document.querySelectorAll("#langList li");
      return Array.from(items).map(li => li.dataset.lang);
    }

    function getViewMode(lang) {
      window._viewModes = window._viewModes || {};
      return window._viewModes[lang] || "original";
    }

    function setViewMode(lang, mode) {
      window._viewModes = window._viewModes || {};
      window._viewModes[lang] = mode;
    }

    function renderLangControls(allLangs, translations = null) {
      const panel = document.getElementById("langControls");
      const ul = document.getElementById("langList");
      ul.innerHTML = "";
      const trans = translations || window._segmentData?.translations || {};
      const tgtLang = allLangs[0] || null;
      const LANG_NAMES = { cs: "Czech", en: "English", uk: "Ukrainian", ru: "Russian", vi: "Vietnamese" };
      allLangs.forEach((lang, idx) => {
        const li = document.createElement("li");
        li.dataset.lang = lang;
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = true;
        cb.title = "Show/hide column";
        const span = document.createElement("span");
        span.textContent = (LANG_NAMES[lang] || lang) + " (" + lang + ")";
        const up = document.createElement("button");
        up.className = "order-btn secondary";
        up.textContent = "↑";
        up.title = "Move up";
        const down = document.createElement("button");
        down.className = "order-btn secondary";
        down.textContent = "↓";
        down.title = "Move down";
        cb.onchange = () => { if (window._segmentData) renderGrid(window._segmentData.data, window._segmentData.translations); };
        up.onclick = () => moveLang(ul, li, -1);
        down.onclick = () => moveLang(ul, li, 1);
        li.append(cb, span, up, down);
        if (idx > 0 && tgtLang) {
          const btnTr = document.createElement("button");
          btnTr.className = "btn-translate primary";
          btnTr.textContent = "Translate";
          btnTr.title = "Translate " + lang + " → " + tgtLang;
          btnTr.onclick = () => doTranslateOne(lang);
          li.appendChild(btnTr);
        }
        if (trans[lang]) {
          const toggle = document.createElement("span");
          toggle.className = "view-toggle";
          const sel = document.createElement("select");
          sel.title = "Original or machine translation";
          sel.appendChild(new Option("Original", "original"));
          sel.appendChild(new Option("MT", "mt"));
          sel.value = getViewMode(lang);
          sel.onchange = () => {
            setViewMode(lang, sel.value);
            if (window._segmentData) renderGrid(window._segmentData.data, window._segmentData.translations);
          };
          toggle.appendChild(sel);
          li.appendChild(toggle);
        }
        ul.appendChild(li);
      });
      panel.style.display = "block";
    }

    function moveLang(ul, li, delta) {
      const items = Array.from(ul.children);
      const idx = items.indexOf(li);
      const newIdx = Math.max(0, Math.min(items.length - 1, idx + delta));
      if (newIdx !== idx) {
        ul.insertBefore(li, items[newIdx]);
        if (window._segmentData) {
          renderGrid(window._segmentData.data, window._segmentData.translations);
        }
      }
    }

    async function loadSegments(docId, baseName, reexported = false) {
      setStatus("Loading segments…", "loading");
      try {
        const reexportedParam = reexported ? "&reexported=true" : "";
        const data = await fetchJSON(`/api/segments?doc_id=${encodeURIComponent(docId)}&base_name=${encodeURIComponent(baseName)}${reexportedParam}`);
        window._segmentData = { data, translations: null, debug: null, translationSource: null, translationTarget: null, chrfScores: {} };
        renderLangControls([...Object.keys(data)].sort());
        renderGrid(data);
        setStatus("", "");
      } catch (e) {
        setStatus("Error: " + e.message, "error");
        document.getElementById("content").innerHTML = `<div class="empty">Failed to load segments.</div>`;
      }
    }

    function renderGrid(data, translations = null) {
      const langs = getVisibleLanguages();
      const trans = translations || window._segmentData?.translations || {};
      renderLangControls(getLanguageOrder(), trans);

      if (!langs.length) {
        document.getElementById("content").innerHTML = `<div class="empty">No visible languages. Enable at least one in the list above.</div>`;
        window._segmentData = window._segmentData || {};
        window._segmentData.translations = trans;
        return;
      }
      const n = Math.max(...langs.map(l => data[l]?.length || 0), 0);

      const cols = ["#", ...langs];
      const colTemplate = `80px repeat(${cols.length - 1}, minmax(200px, 1fr))`;

      const wrap = document.createElement("div");
      wrap.className = "table-wrap";

      const headerDiv = document.createElement("div");
      headerDiv.className = "grid-header";
      headerDiv.style.gridTemplateColumns = colTemplate;
      cols.forEach(h => {
        const th = document.createElement("div");
        th.className = "col-header " + (h === "#" ? "idx" : "");
        if (h !== "#" && trans[h] && getViewMode(h) === "mt") {
          th.textContent = h + " (MT)";
        } else {
          th.textContent = h;
        }
        headerDiv.appendChild(th);
      });

      const bodyDiv = document.createElement("div");
      bodyDiv.className = "grid-body";
      bodyDiv.style.gridTemplateColumns = colTemplate;
      for (let i = 0; i < n; i++) {
        const idxCell = document.createElement("div");
        idxCell.className = "cell idx";
        idxCell.textContent = i + 1;
        bodyDiv.appendChild(idxCell);
        for (const lang of langs) {
          const cell = document.createElement("div");
          cell.className = "cell";
          const showMt = trans[lang] && getViewMode(lang) === "mt";
          cell.textContent = showMt ? (trans[lang][i] ?? "") : (data[lang]?.[i] ?? "");
          if (showMt) {
            cell.classList.add("translation");
            const chrfScores = window._segmentData?.chrfScores?.[lang];
            const score = chrfScores?.[i];
            if (score != null) {
              const span = document.createElement("span");
              span.className = "chrf-score";
              span.textContent = "chrF " + score;
              cell.appendChild(span);
              if (score >= CHRF_GOOD) cell.classList.add("chrf-good");
              else if (score < CHRF_BAD) cell.classList.add("chrf-bad");
            }
          }
          bodyDiv.appendChild(cell);
        }
      }

      wrap.appendChild(headerDiv);
      wrap.appendChild(bodyDiv);
      document.getElementById("content").innerHTML = "";
      document.getElementById("content").appendChild(wrap);
      window._segmentData = window._segmentData || {};
      window._segmentData.translations = trans;
      if (window._segmentData.debug) showDebugPanel(window._segmentData.debug);
    }

    function showDebugPanel(debug) {
      const existing = document.getElementById("debugPanel");
      if (existing) existing.remove();
      const details = document.createElement("details");
      details.id = "debugPanel";
      details.className = "debug-panel";
      details.innerHTML = "<summary>Translation debug output</summary>";
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(debug, null, 2);
      details.appendChild(pre);
      document.getElementById("content").appendChild(details);
    }

    async function fetchChrfScores(references, hypotheses) {
      try {
        const r = await fetch(API + "/api/chrf", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ references, hypotheses }),
        });
        if (!r.ok) return null;
        const { scores } = await r.json();
        return scores;
      } catch (e) {
        return null;
      }
    }

    async function doTranslateOne(srcLang) {
      const { data, translations: existing } = window._segmentData || {};
      if (!data) return;
      const langs = getVisibleLanguages();
      const tgt = langs[0];
      if (!tgt || srcLang === tgt) return;
      const n = data[srcLang]?.length ?? 0;
      const texts = [];
      for (let i = 0; i < n; i++) {
        texts.push(data[srcLang][i] ?? "");
      }
      setStatus("Translating " + srcLang + " → " + tgt + "…", "loading");
      try {
        const r = await fetch(API + "/api/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ texts, source_lang: srcLang, target_lang: tgt }),
        });
        if (!r.ok) throw new Error(await r.text());
        const resp = await r.json();
        window._segmentData.debug = resp.debug;
        const trans = { ...(existing || {}), [srcLang]: resp.translations };
        window._segmentData.translations = trans;
        setStatus("Computing chrF…", "loading");
        const refs = (data[tgt] || []).slice(0, n);
        const hyps = resp.translations;
        const chrfScores = await fetchChrfScores(refs, hyps);
        window._segmentData.chrfScores = window._segmentData.chrfScores || {};
        if (chrfScores) window._segmentData.chrfScores[srcLang] = chrfScores;
        renderGrid(data, trans);
        setStatus("Done", "ok");
      } catch (e) {
        setStatus("Translation error: " + e.message, "error");
      }
    }

    async function doTranslate() {
      if (isAlignmentMode()) {
        const { segments } = window._alignmentData || {};
        if (!segments) return;
        const langs = [...Object.keys(segments)].sort();
        const firstLang = langs[0];
        const others = langs.filter(l => l !== firstLang);
        if (!others.length) return;
        setStatus("Translating to " + firstLang + "…", "loading");
        const trans = window._alignmentData.translations || {};
        try {
          for (const srcLang of others) {
            const texts = (segments[srcLang] || []).map(s => s || "");
            const r = await fetch(API + "/api/translate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ texts, source_lang: srcLang, target_lang: firstLang }),
            });
            if (!r.ok) throw new Error(await r.text());
            const resp = await r.json();
            trans[srcLang] = resp.translations || [];
          }
          window._alignmentData.translations = trans;
          renderAlignmentGrid({ tu_ids: window._alignmentData.tu_ids, segments });
          setStatus("Done. Hover over segments for translation tooltip.", "ok");
        } catch (e) {
          setStatus("Translation error: " + e.message, "error");
        }
        return;
      }
      const { data } = window._segmentData || {};
      if (!data) return;
      const langs = getVisibleLanguages();
      if (langs.length < 2) {
        setStatus("Need at least 2 visible languages (first = target).", "error");
        return;
      }
      await doTranslateOne(langs[1]);
    }

    async function doRefresh() {
      setStatus("Refreshing MOS files…", "loading");
      document.getElementById("btnRefresh").disabled = true;
      try {
        const r = await fetch(API + "/api/refresh", { method: "POST" });
        const body = await r.text();
        if (!r.ok) throw new Error(body);
        setStatus("Refresh complete", "ok");
        await loadDocs();
      } catch (e) {
        setStatus("Refresh failed: " + e.message, "error");
      } finally {
        document.getElementById("btnRefresh").disabled = false;
      }
    }

    async function doTranslateAllDocs() {
      setStatus("Translating all documents (caching MT)…", "loading");
      try {
        const inAlignment = isAlignmentMode();
        const r = await fetch(API + "/api/translate_all", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reexported: false }),
        });
        const body = await r.text();
        if (!r.ok) throw new Error(body);
        setStatus("Translate-all finished (cache populated).", "ok");
      } catch (e) {
        setStatus("Translate-all failed: " + e.message, "error");
      }
    }

    function isAlignmentMode() { return document.getElementById("modeSelect").value === "alignment"; }

    function resetAlignmentState() {
      window._alignmentExcluded = [];
      window._alignmentMerges = [];
      window._alignmentEdits = {};
      window._alignmentRemoveInLang = [];
      window._alignmentInserts = [];
      window._alignmentHideScheduledDeletions = false;
      window._alignmentHistory = [];
      window._alignmentInsertCounter = 0;
      window._alignmentData = null;
      window._alignmentCheck = null;
      const undoBtn = document.getElementById("btnUndo");
      if (undoBtn) undoBtn.disabled = true;
    }

    function updatePendingStatus() {
      const excl = (window._alignmentExcluded || []).length;
      const merges = (window._alignmentMerges || []).length;
      const edits = Object.keys(window._alignmentEdits || {}).length;
      const inserts = (window._alignmentInserts || []).length;
      const removals = (window._alignmentRemoveInLang || []).length;
      const parts = [];
      if (excl) parts.push(`${excl} excluded`);
      if (merges) parts.push(`${merges} merges`);
      if (edits) parts.push(`${edits} per-lang edits`);
      if (removals) parts.push(`${removals} per-lang delete(s)`);
      if (inserts) parts.push(`${inserts} new segment(s)`);
      setStatus(parts.length ? "Pending: " + parts.join(", ") : "", parts.length ? "ok" : "");
      const undoBtn = document.getElementById("btnUndo");
      if (undoBtn) undoBtn.disabled = !(window._alignmentHistory || []).length;
    }

    // --- Undo: snapshot the pending-edit state before each mutating action ---
    function snapshotAlignmentState() {
      return {
        excluded: [...(window._alignmentExcluded || [])],
        merges: (window._alignmentMerges || []).map(m => ({ ...m })),
        edits: { ...(window._alignmentEdits || {}) },
        removeInLang: (window._alignmentRemoveInLang || []).map(x => ({ ...x })),
        inserts: (window._alignmentInserts || []).map(x => ({ ...x })),
      };
    }
    function pushHistory() {
      window._alignmentHistory = window._alignmentHistory || [];
      window._alignmentHistory.push(snapshotAlignmentState());
      if (window._alignmentHistory.length > 200) window._alignmentHistory.shift();
    }
    function undoLast() {
      const hist = window._alignmentHistory || [];
      if (!hist.length) { setStatus("Nothing to undo.", ""); return; }
      const prev = hist.pop();
      window._alignmentExcluded = prev.excluded;
      window._alignmentMerges = prev.merges;
      window._alignmentEdits = prev.edits;
      window._alignmentRemoveInLang = prev.removeInLang;
      window._alignmentInserts = prev.inserts;
      updatePendingStatus();
      if (window._alignmentData) {
        renderAlignmentGrid({ tu_ids: window._alignmentData.tu_ids, segments: window._alignmentData.segments });
      }
    }

    async function loadAlignment(docId, reexported = false) {
      setStatus("Loading alignment…", "loading");
      try {
        const reexportedParam = reexported ? "&reexported=true" : "";
        const subset = await fetchJSON(`/api/alignment/subset?doc_id=${encodeURIComponent(docId)}${reexportedParam}`);
        document.getElementById("alignCounts").textContent = Object.entries(subset.counts_per_lang || {}).map(([l,n]) => `${l}:${n}`).join(", ");
        document.getElementById("alignCommon").textContent = subset.common_count || 0;
        document.getElementById("alignmentOverview").style.display = "block";
        const data = await fetchJSON(`/api/alignment/segments?doc_id=${encodeURIComponent(docId)}${reexportedParam}`);
        window._alignmentData = { docId, reexported, ...data };
        const firstLang = Object.keys(data.segments || {})[0];
        if (firstLang && data.segments) {
          setStatus("Computing chrF…", "loading");
          const refs = data.segments[firstLang] || [];
          const otherLangs = Object.keys(data.segments).filter(l => l !== firstLang);
          const results = await Promise.all(
            otherLangs.map(lang => fetchChrfScores(refs, data.segments[lang] || []))
          );
          const chrfScores = {};
          otherLangs.forEach((lang, idx) => { if (results[idx]) chrfScores[lang] = results[idx]; });
          window._alignmentData.chrfScores = chrfScores;
        }
        renderAlignmentGrid(data);
        document.getElementById("btnApply").style.display = "inline-block";
        setStatus("", "");
      } catch (e) {
        setStatus("Alignment error: " + e.message, "error");
        document.getElementById("content").innerHTML = `<div class="empty">Failed to load alignment. Ensure MOS files exist.</div>`;
      }
    }

    // Build the ordered list of display entries for one language, applying all
    // pending client-side edits (merges, per-lang removals, per-lang inserts) so
    // changes render immediately without a server round-trip.
    function buildLangEntries(lang, tu_ids, excludedSet) {
      let entries = tu_ids
        .map((tuId, i) => ({ tuId, origIdx: i, kind: "seg", mergedFrom: [] }))
        .filter(e => !excludedSet.has(e.tuId));

      // Merges (per language): fold "from" entries into their "into" root.
      const merges = (window._alignmentMerges || []).filter(m => m.lang === lang);
      const mergeMap = {};
      merges.forEach(m => { mergeMap[m.from_id] = m.into_id; });
      function resolveRoot(id) {
        const seen = new Set();
        while (mergeMap[id] && !seen.has(id)) { seen.add(id); id = mergeMap[id]; }
        return id;
      }
      const order = [];
      const byRoot = {};
      for (const e of entries) {
        const root = resolveRoot(e.tuId);
        if (!byRoot[root]) { byRoot[root] = []; order.push(root); }
        byRoot[root].push(e);
      }
      entries = order.map(root => {
        const group = byRoot[root];
        const rootEntry = group.find(e => e.tuId === root) || group[0];
        return {
          tuId: root,
          origIdx: rootEntry.origIdx,
          kind: group.length > 1 ? "merged" : "seg",
          mergedFrom: group.filter(e => e.tuId !== root).map(e => e.tuId),
        };
      });

      // Per-language removal: keep it visible in place (struck through) unless hidden.
      const removeSet = new Set(
        (window._alignmentRemoveInLang || []).filter(x => x.lang === lang).map(x => x.idx)
      );
      entries = entries.map(e => ({ ...e, removed: removeSet.has(e.tuId) }));
      if (window._alignmentHideScheduledDeletions) entries = entries.filter(e => !e.removed);

      // Inserts: splice new blank/editable rows at their requested position.
      const inserts = (window._alignmentInserts || []).filter(x => x.lang === lang);
      for (const ins of inserts) {
        const newEntry = { tuId: ins.id, origIdx: -1, kind: "insert", mergedFrom: [], removed: false };
        if (ins.after_id === "-1") {
          entries.unshift(newEntry);
        } else {
          const pos = entries.findIndex(e => e.tuId === ins.after_id);
          if (pos >= 0) entries.splice(pos + 1, 0, newEntry);
          else entries.push(newEntry);
        }
      }
      return entries;
    }

    function segmentText(lang, entry, segments) {
      const key = `${lang}:${entry.tuId}`;
      const edits = window._alignmentEdits || {};
      if (key in edits) return edits[key];
      if (entry.kind === "insert") return "";
      const base = segments[lang]?.[entry.origIdx] ?? "";
      if (entry.kind === "merged") {
        const parts = [base, ...entry.mergedFrom.map(id => segments[lang]?.[Number(id)] ?? "")];
        return parts.join(" ").trim();
      }
      return base;
    }

    function renderAlignmentGrid(data) {
      const { tu_ids, segments } = data;
      const langs = [...Object.keys(segments)].sort();
      if (!tu_ids || !langs.length) {
        document.getElementById("content").innerHTML = `<div class="empty">No aligned segments.</div>`;
        return;
      }
      const excludedSet = new Set(window._alignmentExcluded || []);
      const entriesByLang = {};
      langs.forEach(lang => { entriesByLang[lang] = buildLangEntries(lang, tu_ids, excludedSet); });
      const spineLang = langs[0];
      const rowCount = Math.max(...langs.map(l => entriesByLang[l].length), 0);

      // Highlight problems from the last "Check alignment" run (if it's for this doc).
      const check = window._alignmentCheck && window._alignmentCheck.doc_id === window._alignmentData?.docId
        ? window._alignmentCheck : null;
      const checkCodeErrorsByLang = {};
      const checkCountMismatchLangs = new Set();
      if (check) {
        for (const m of check.code_mismatches) {
          if (!checkCodeErrorsByLang[m.lang]) checkCodeErrorsByLang[m.lang] = new Map();
          checkCodeErrorsByLang[m.lang].set(m.idx, m);
        }
        for (const m of check.count_mismatches) checkCountMismatchLangs.add(m.lang);
      }

      const cols = ["#", "tu-id", "Include", ...langs];
      const colTemplate = `50px 70px 60px repeat(${langs.length}, minmax(200px, 1fr))`;
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      const headerDiv = document.createElement("div");
      headerDiv.className = "grid-header";
      headerDiv.style.gridTemplateColumns = colTemplate;
      cols.forEach(h => {
        const th = document.createElement("div");
        th.className = "col-header" + (checkCountMismatchLangs.has(h) ? " check-error-col" : "");
        if (langs.includes(h)) {
          const label = document.createElement("span");
          label.textContent = h;
          if (checkCountMismatchLangs.has(h)) {
            const mismatch = check.count_mismatches.find(m => m.lang === h);
            label.title = `Segment count mismatch: ${h} has ${mismatch.count}, expected ${mismatch.expected} (to match '${check.first_lang}')`;
            label.textContent = "⚠ " + h;
          }
          const addStart = document.createElement("button");
          addStart.className = "btn-add-below secondary";
          addStart.textContent = "+ start";
          addStart.title = "Add empty segment at the start of " + h;
          addStart.onclick = () => {
            pushHistory();
            window._alignmentInsertCounter = (window._alignmentInsertCounter || 0) + 1;
            window._alignmentInserts = window._alignmentInserts || [];
            window._alignmentInserts.push({ lang: h, after_id: "-1", id: "new-" + window._alignmentInsertCounter });
            updatePendingStatus();
            renderAlignmentGrid({ tu_ids: window._alignmentData.tu_ids, segments: window._alignmentData.segments });
          };
          th.append(label, addStart);
        } else {
          th.textContent = h;
        }
        headerDiv.appendChild(th);
      });
      const bodyDiv = document.createElement("div");
      bodyDiv.className = "grid-body";
      bodyDiv.style.gridTemplateColumns = colTemplate;
      const chrfScores = window._alignmentData?.chrfScores || {};
      const translations = window._alignmentData?.translations || {};

      for (let rowIdx = 0; rowIdx < rowCount; rowIdx++) {
        const spineEntry = entriesByLang[spineLang][rowIdx];
        const idxCell = document.createElement("div");
        idxCell.className = "cell idx";
        idxCell.textContent = rowIdx + 1;
        bodyDiv.appendChild(idxCell);

        const tuCell = document.createElement("div");
        tuCell.className = "cell";
        tuCell.textContent = spineEntry ? spineEntry.tuId : "—";
        bodyDiv.appendChild(tuCell);

        const incCell = document.createElement("div");
        incCell.className = "cell row-exclude";
        if (spineEntry && spineEntry.kind !== "insert") {
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !excludedSet.has(spineEntry.tuId);
          cb.title = "Exclude this row in all languages";
          cb.onchange = () => {
            pushHistory();
            window._alignmentExcluded = window._alignmentExcluded || [];
            if (cb.checked) {
              window._alignmentExcluded = window._alignmentExcluded.filter(x => x !== spineEntry.tuId);
            } else {
              window._alignmentExcluded.push(spineEntry.tuId);
            }
            updatePendingStatus();
            renderAlignmentGrid({ tu_ids: window._alignmentData.tu_ids, segments: window._alignmentData.segments });
          };
          incCell.appendChild(cb);
        }
        bodyDiv.appendChild(incCell);

        for (const lang of langs) {
          const entry = entriesByLang[lang][rowIdx];
          const cellWrap = document.createElement("div");
          if (!entry) {
            cellWrap.className = "cell";
            bodyDiv.appendChild(cellWrap);
            continue;
          }
          const isExcl = spineEntry && excludedSet.has(spineEntry.tuId);
          const codeError = entry.kind === "seg" ? checkCodeErrorsByLang[lang]?.get(entry.origIdx) : null;
          cellWrap.className = "cell cell-editable"
            + (isExcl ? " excluded" : "")
            + (entry.removed && !window._alignmentHideScheduledDeletions ? " will-remove" : "")
            + (codeError ? " check-error" : "");

          const transText = entry.kind === "seg" && lang !== spineLang && translations[lang]?.[entry.origIdx]
            ? translations[lang][entry.origIdx].trim() : null;
          if (transText) cellWrap.title = "Translation → " + spineLang + ": " + transText;
          if (codeError) {
            const msg = `Formatting mismatch vs '${check.first_lang}' skeleton: skeleton codes `
              + `${JSON.stringify(codeError.skeleton_codes)}, '${lang}' codes ${JSON.stringify(codeError.lang_codes)}. `
              + "Reexport will fail here until this is fixed.";
            cellWrap.title = cellWrap.title ? cellWrap.title + " | " + msg : msg;
          }

          const initialText = segmentText(lang, entry, segments);
          const content = document.createElement("div");
          content.className = "cell-content";
          content.contentEditable = !isExcl;
          content.textContent = initialText;
          content.dataset.lang = lang;
          content.dataset.tuId = entry.tuId;
          // Snapshot once per edit session (on focus) for Undo, then capture text on
          // every keystroke (not just on blur) so a fast Apply click can never race
          // ahead of a pending blur and drop what was typed. Merely focusing/blurring a
          // cell without typing must NOT record an edit — some source segments are
          // intentionally whitespace-only structural placeholders in the original
          // document, and trimming/rewriting them (even to equivalent-looking text)
          // can desync Tikal's merge back into the docx.
          content.onfocus = () => { pushHistory(); };
          content.oninput = () => {
            const key = `${lang}:${entry.tuId}`;
            const cur = content.textContent;
            window._alignmentEdits = window._alignmentEdits || {};
            if (cur === initialText) delete window._alignmentEdits[key];
            else window._alignmentEdits[key] = cur;
            updatePendingStatus();
          };
          content.onblur = () => {
            const key = `${lang}:${entry.tuId}`;
            const edits = window._alignmentEdits || {};
            if (!(key in edits)) return; // no real edit happened this session
            const trimmed = content.textContent.trimEnd();
            if (trimmed === initialText) delete edits[key];
            else edits[key] = trimmed;
            updatePendingStatus();
          };

          if (entry.kind === "seg") {
            const score = lang !== spineLang ? chrfScores[lang]?.[entry.origIdx] : null;
            if (score != null && typeof score === "number") {
              const span = document.createElement("span");
              span.className = "chrf-score";
              span.textContent = "chrF " + score;
              cellWrap.appendChild(span);
              if (score >= CHRF_GOOD) cellWrap.classList.add("chrf-good");
              else if (score < CHRF_BAD) cellWrap.classList.add("chrf-bad");
            }
          }

          const btnRow = document.createElement("span");
          btnRow.className = "cell-btn-row";

          const addBtn = document.createElement("button");
          addBtn.className = "btn-add-below secondary";
          addBtn.textContent = "+";
          addBtn.title = "Add empty segment below, in " + lang + " only";
          addBtn.onclick = (e) => {
            e.preventDefault();
            pushHistory();
            window._alignmentInsertCounter = (window._alignmentInsertCounter || 0) + 1;
            window._alignmentInserts = window._alignmentInserts || [];
            window._alignmentInserts.push({ lang, after_id: entry.tuId, id: "new-" + window._alignmentInsertCounter });
            updatePendingStatus();
            renderAlignmentGrid({ tu_ids: window._alignmentData.tu_ids, segments: window._alignmentData.segments });
          };
          btnRow.appendChild(addBtn);

          const nextEntry = entriesByLang[lang][rowIdx + 1];
          if (entry.kind !== "insert" && nextEntry && nextEntry.kind !== "insert") {
            const mergeBtn = document.createElement("button");
            mergeBtn.className = "btn-merge secondary";
            mergeBtn.textContent = "Merge↓";
            mergeBtn.title = "Merge next segment into this one, in " + lang + " only";
            mergeBtn.onclick = (e) => {
              e.preventDefault();
              pushHistory();
              window._alignmentMerges = window._alignmentMerges || [];
              window._alignmentMerges.push({ lang, from_id: nextEntry.tuId, into_id: entry.tuId });
              updatePendingStatus();
              renderAlignmentGrid({ tu_ids: window._alignmentData.tu_ids, segments: window._alignmentData.segments });
            };
            btnRow.appendChild(mergeBtn);
          }

          const clearBtn = document.createElement("button");
          clearBtn.className = "btn-clear";
          clearBtn.textContent = "×";
          if (entry.kind === "insert") {
            clearBtn.title = "Cancel this new segment in " + lang;
            clearBtn.onclick = (e) => {
              e.preventDefault();
              pushHistory();
              window._alignmentInserts = (window._alignmentInserts || []).filter(x => x.id !== entry.tuId);
              delete (window._alignmentEdits || {})[`${lang}:${entry.tuId}`];
              updatePendingStatus();
              renderAlignmentGrid({ tu_ids: window._alignmentData.tu_ids, segments: window._alignmentData.segments });
            };
          } else {
            clearBtn.title = "Delete this segment in " + lang + " only (click again to undo)";
            clearBtn.onclick = (e) => {
              e.preventDefault();
              pushHistory();
              window._alignmentRemoveInLang = window._alignmentRemoveInLang || [];
              const idx = window._alignmentRemoveInLang.findIndex(x => x.lang === lang && x.idx === entry.tuId);
              if (idx >= 0) window._alignmentRemoveInLang.splice(idx, 1);
              else window._alignmentRemoveInLang.push({ lang, idx: entry.tuId });
              updatePendingStatus();
              renderAlignmentGrid({ tu_ids: window._alignmentData.tu_ids, segments: window._alignmentData.segments });
            };
          }
          btnRow.appendChild(clearBtn);
          cellWrap.appendChild(btnRow);
          cellWrap.appendChild(content);
          bodyDiv.appendChild(cellWrap);
        }
      }
      wrap.appendChild(headerDiv);
      wrap.appendChild(bodyDiv);
      document.getElementById("content").innerHTML = "";
      document.getElementById("content").appendChild(wrap);
      updatePendingStatus();
    }

    async function doApply() {
      const { docId, segments } = window._alignmentData || {};
      if (!docId) return;
      const excludeIds = window._alignmentExcluded || [];
      const merges = window._alignmentMerges || [];
      const removeInLang = window._alignmentRemoveInLang || [];
      const editsMap = window._alignmentEdits || {};
      const insertAfter = (window._alignmentInserts || []).map(ins => ({
        lang: ins.lang,
        after_id: ins.after_id,
        text: editsMap[`${ins.lang}:${ins.id}`] || "",
      }));
      const insertKeys = new Set((window._alignmentInserts || []).map(ins => `${ins.lang}:${ins.id}`));
      const edits = Object.entries(editsMap)
        .filter(([key]) => !insertKeys.has(key))
        .map(([key, text]) => {
          const [lang, idx] = key.split(":");
          return { lang, idx, text };
        });
      const firstLang = segments && Object.keys(segments)[0];
      setStatus("Applying to MOS…", "loading");
      document.getElementById("btnApply").disabled = true;
      try {
        const reexported = !!(window._alignmentData && window._alignmentData.reexported);
        const r = await fetch(API + "/api/mos/apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            doc_id: docId,
            exclude_ids: excludeIds,
            merges,
            edits,
            insert_after: insertAfter,
            remove_in_lang: removeInLang,
            first_lang: firstLang,
            reexported,
          }),
        });
        if (!r.ok) throw new Error(await r.text());
        const result = await r.json();
        const outDocId = result.out_doc_id || docId;
        setStatus("Applied. Refreshing…", "ok");
        window._alignmentExcluded = [];
        window._alignmentMerges = [];
        window._alignmentEdits = {};
        window._alignmentRemoveInLang = [];
        window._alignmentInserts = [];
        window._alignmentHistory = [];
        window._alignmentCheck = null; // stale: on-disk MOS just changed
        await loadDocs();
        // Edits to a non-reexported doc are written to a new "<doc_id>_remerged"
        // sibling document rather than overwriting the original MOS, so switch
        // the selector and view to it or the applied changes won't be visible.
        const sel = document.getElementById("docSelect");
        for (const opt of sel.options) {
          try {
            const parsed = JSON.parse(opt.value);
            if (parsed.doc_id === outDocId && !!parsed.reexported === reexported) {
              sel.value = opt.value;
              break;
            }
          } catch (e) { /* ignore malformed option values */ }
        }
        if (isAlignmentMode()) loadAlignment(outDocId, reexported);
      } catch (e) {
        setStatus("Apply failed: " + e.message, "error");
      } finally {
        document.getElementById("btnApply").disabled = false;
      }
    }

    document.getElementById("docSelect").addEventListener("change", (e) => {
      const v = e.target.value;
      // Switching documents: forget all alignment state from the previous one.
      resetAlignmentState();
      if (!v) {
        document.getElementById("content").innerHTML = `<div class="empty">Select a document.</div>`;
        document.getElementById("alignmentOverview").style.display = "none";
        document.getElementById("btnApply").style.display = "none";
        return;
      }
      const { doc_id, base_name, reexported } = JSON.parse(v);
      const isReexported = !!reexported;
      if (isAlignmentMode()) {
        loadAlignment(doc_id, isReexported);
        document.getElementById("langControls").style.display = "none";
      } else {
        loadSegments(doc_id, base_name, isReexported);
        document.getElementById("alignmentOverview").style.display = "none";
        document.getElementById("btnApply").style.display = "none";
      }
    });
    document.getElementById("modeSelect").addEventListener("change", () => {
      const v = document.getElementById("docSelect").value;
      if (!v) {
        document.getElementById("content").innerHTML = `<div class="empty">Select a document.</div>`;
        document.getElementById("alignmentOverview").style.display = "none";
        document.getElementById("langControls").style.display = "none";
        document.getElementById("btnApply").style.display = "none";
        return;
      }
      const { doc_id, base_name, reexported } = JSON.parse(v);
      const isReexported = !!reexported;
      if (isAlignmentMode()) {
        loadAlignment(doc_id, isReexported);
        document.getElementById("langControls").style.display = "none";
        document.getElementById("alignmentOverview").style.display = "block";
        document.getElementById("btnApply").style.display = "inline-block";
      } else {
        loadSegments(doc_id, base_name, isReexported);
        document.getElementById("alignmentOverview").style.display = "none";
        document.getElementById("btnApply").style.display = "none";
      }
    });
    document.getElementById("btnTranslate").addEventListener("click", doTranslate);
    document.getElementById("btnTranslateAll").addEventListener("click", doTranslateAllDocs);
    document.getElementById("btnRefresh").addEventListener("click", doRefresh);
    document.getElementById("btnApply").addEventListener("click", doApply);
    document.getElementById("btnUndo").addEventListener("click", undoLast);
    function showReexportResult(kind, message) {
      const existing = document.getElementById("reexportPanel");
      if (existing) existing.remove();
      if (!message) return;
      const panel = document.createElement("div");
      panel.id = "reexportPanel";
      panel.className = "debug-panel";
      const color = kind === "error" ? "var(--error)" : kind === "warning" ? "var(--accent)" : "var(--success)";
      panel.style.borderColor = color;
      const title = document.createElement("strong");
      title.style.color = color;
      title.textContent = kind === "error" ? "Reexport failed" : kind === "warning" ? "Reexport completed with warnings" : "Reexport complete";
      panel.appendChild(title);
      const pre = document.createElement("pre");
      pre.textContent = message;
      panel.appendChild(pre);
      document.getElementById("content").prepend(panel);
    }

    function renderCheckPanel(check) {
      const existing = document.getElementById("checkPanel");
      if (existing) existing.remove();
      const panel = document.createElement("div");
      panel.id = "checkPanel";
      panel.className = "debug-panel";
      const color = check.ok ? "var(--success)" : "var(--error)";
      panel.style.borderColor = color;
      const title = document.createElement("strong");
      title.style.color = color;
      title.textContent = check.ok
        ? "Alignment check passed — safe to reexport"
        : `Alignment check found ${check.count_mismatches.length} count issue(s) and ${check.code_mismatches.length} formatting issue(s)`;
      panel.appendChild(title);
      if (!check.ok) {
        const list = document.createElement("ul");
        list.style.margin = "0.5rem 0 0";
        list.style.paddingLeft = "1.2rem";
        for (const m of check.count_mismatches) {
          const li = document.createElement("li");
          li.textContent = `'${m.lang}' has ${m.count} segment(s) in ${m.file}, expected ${m.expected} `
            + `(to match the '${check.first_lang}' skeleton)`;
          list.appendChild(li);
        }
        for (const m of check.code_mismatches) {
          const li = document.createElement("li");
          li.textContent = `'${m.lang}' segment #${m.idx + 1}: skeleton codes ${JSON.stringify(m.skeleton_codes)} `
            + `vs '${m.lang}' codes ${JSON.stringify(m.lang_codes)} — skeleton: "${m.skeleton_text}", `
            + `${m.lang}: "${m.lang_text}"`;
          list.appendChild(li);
        }
        panel.appendChild(list);
        const hint = document.createElement("div");
        hint.style.marginTop = "0.5rem";
        hint.style.color = "var(--muted)";
        hint.textContent = "Problem cells are outlined in the grid above (⚠). Fix these with the alignment "
          + "editing tools (merge/split/edit/remove), Apply to MOS, then check again.";
        panel.appendChild(hint);
      }
      document.getElementById("content").prepend(panel);
    }

    async function doCheckAlignment(docId, reexported) {
      const check = await fetchJSON(`/api/alignment/check?doc_id=${encodeURIComponent(docId)}&reexported=${!!reexported}`);
      window._alignmentCheck = check;
      renderCheckPanel(check);
      if (window._alignmentData && window._alignmentData.docId === docId && isAlignmentMode()) {
        renderAlignmentGrid({ tu_ids: window._alignmentData.tu_ids, segments: window._alignmentData.segments });
      }
      return check;
    }

    document.getElementById("btnCheckAlignment").addEventListener("click", async () => {
      const v = document.getElementById("docSelect").value;
      if (!v) {
        setStatus("Select a document to check.", "error");
        return;
      }
      const { doc_id, reexported } = JSON.parse(v);
      showReexportResult(null, null);
      setStatus("Checking alignment…", "loading");
      document.getElementById("btnCheckAlignment").disabled = true;
      try {
        const check = await doCheckAlignment(doc_id, !!reexported);
        setStatus(
          check.ok ? "Alignment check passed — safe to reexport."
            : `Alignment check found ${check.count_mismatches.length} count issue(s) and ${check.code_mismatches.length} formatting issue(s) — see details below.`,
          check.ok ? "ok" : "error"
        );
      } catch (e) {
        setStatus("Check failed: " + e.message, "error");
      } finally {
        document.getElementById("btnCheckAlignment").disabled = false;
      }
    });

    document.getElementById("btnReexport").addEventListener("click", async () => {
      const v = document.getElementById("docSelect").value;
      if (!v) {
        setStatus("Select a document to reexport.", "error");
        return;
      }
      const { doc_id, reexported } = JSON.parse(v);
      const reexportedParam = reexported ? "&reexported=true" : "";
      showReexportResult(null, null);
      setStatus("Checking alignment before reexport…", "loading");
      document.getElementById("btnReexport").disabled = true;
      try {
        // Always re-check immediately before reexporting: a stale/absent check must
        // never let a broken merge reach Tikal, since a bad merge there fails with an
        // opaque Java stack trace instead of a clear, actionable message.
        const check = await doCheckAlignment(doc_id, !!reexported);
        if (!check.ok) {
          setStatus(
            `Reexport blocked: ${check.count_mismatches.length} count issue(s) and ${check.code_mismatches.length} `
            + "formatting issue(s) found — see details below and fix them before reexporting.",
            "error"
          );
          return;
        }
        setStatus("Reexporting…", "loading");
        const r = await fetch(API + `/api/reexport?doc_id=${encodeURIComponent(doc_id)}${reexportedParam}`, {
          method: "POST",
        });
        const bodyText = await r.text();
        let parsed = null;
        try { parsed = JSON.parse(bodyText); } catch (e) { /* backend returned non-JSON */ }
        if (!r.ok) {
          const msg = parsed?.detail || bodyText || `HTTP ${r.status}`;
          showReexportResult("error", msg);
          throw new Error(msg);
        }
        const warnings = parsed?.warnings || [];
        if (warnings.length) {
          showReexportResult("warning", parsed.message || warnings.join("\n"));
          setStatus("Reexport complete, with warnings — see details below.", "ok");
        } else {
          setStatus(parsed?.message || "Reexport complete.", "ok");
        }
      } catch (e) {
        setStatus("Reexport failed: " + e.message, "error");
      } finally {
        document.getElementById("btnReexport").disabled = false;
      }
    });
    document.getElementById("btnHideScheduled").addEventListener("click", () => {
      window._alignmentHideScheduledDeletions = !window._alignmentHideScheduledDeletions;
      const btn = document.getElementById("btnHideScheduled");
      btn.textContent = window._alignmentHideScheduledDeletions ? "Show scheduled deletions" : "Hide scheduled deletions";
      if (window._alignmentData) {
        renderAlignmentGrid({ tu_ids: window._alignmentData.tu_ids, segments: window._alignmentData.segments });
      }
    });

    loadDocs();
  </script>
</body>
</html>
